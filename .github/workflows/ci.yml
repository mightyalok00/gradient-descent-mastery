name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate Notebook Integrity
      run: |
        python build_notebook.py

    - name: Validate Python Modules
      run: |
        python -c "from src import load_and_preprocess_data, MissingDataFormulaAnalyzer, LinearRegressionGD, LogisticRegressionGD, ComprehensiveDataProfiler; print('All core modules imported cleanly!')"

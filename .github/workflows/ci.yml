name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile app.py
          python -m compileall -q src

      - name: Validate core modules
        run: |
          python -c "from src import load_and_preprocess_data, MissingDataFormulaAnalyzer, LinearRegressionGD, LogisticRegressionGD, ComprehensiveDataProfiler; print('Core modules imported successfully.')"

      - name: Validate notebook integrity
        run: |
          python build_notebook.py

      - name: Validate notebooks
        run: |
          python -m nbformat.validator notebooks/*.ipynb
